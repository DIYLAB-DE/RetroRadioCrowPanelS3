[platformio]
default_envs = crowpanel7
; Lokale Anschlüsse dieses Rechners (upload_port, monitor_port), nicht versioniert.
extra_configs = platformio_lokal.ini

; Elecrow CrowPanel 7.0" ESP32-S3 (DIS08070H): ESP32-S3-WROOM-1-N4R8, 4 MB Flash (Quad), 8 MB PSRAM (Octal), RGB-Panel 800x480, GT911, NS4168, SD über SPI.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = crowpanel7-s3
board_build.partitions = partitions_crowpanel7.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 4063232
build_type = release
; LovyanGFX für den RGB-Bus des S3, Sprites und VLW-Schriften.
lib_deps =
    lovyan03/LovyanGFX@1.2.36
    https://github.com/DIYLAB-DE/audio-lite.git#v0.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLGFX_USE_V1
monitor_speed = 115200
upload_speed = 921600
extra_scripts =
    pre:scripts/generate_html_header.py
    pre:scripts/fw_version.py

; Standardbuild ohne Befehlseingang
[env:crowpanel7]

; Entwicklungsbuild mit Befehlseingang über UART0 (921600 Baud): Ansichten, Touch, Screenshot
[env:crowpanel7_dev]
build_src_flags = -DCROWPANEL_USB_FERNSTEUERUNG=1
build_flags =
    ${env.build_flags}
    -DAUDIO_LITE_TIMING=1
monitor_speed = 921600

